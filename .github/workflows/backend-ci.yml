name: Backend CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ----------------------------------------------------
  # NODO 1: Calidad de Código (Flake8 y Pylint)
  # ----------------------------------------------------
  code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    strategy:
      matrix:
        microservice: 
          - backend/microservice_1_sync
          - backend/microservice_2_core
          - backend/microservice_3_rag

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install dependencies
      run: |
        cd ${{ matrix.microservice }}
        python -m pip install --upgrade pip
        pip install flake8 pylint
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Capstone - Critical Syntax Check
      run: |
        cd ${{ matrix.microservice }}
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Checkstyle Equivalent (Flake8 Full Report)
      run: |
        cd ${{ matrix.microservice }}
        flake8 . --output-file=flake8-report.txt --exit-zero

    - name: PMD Equivalent (Pylint Static Analysis)
      run: |
        cd ${{ matrix.microservice }}
        find . -type f -name "*.py" | xargs pylint --output-format=text > pylint-report.txt || true

    - name: Upload Linting Reports
      uses: actions/upload-artifact@v4
      with:
        name: linting-reports-${{ strategy.job-index }}
        path: |
          ${{ matrix.microservice }}/flake8-report.txt
          ${{ matrix.microservice }}/pylint-report.txt

  # ----------------------------------------------------
  # NODO 2: Pruebas (Pytest y Cobertura)
  # ----------------------------------------------------
  testing:
    name: Unit Testing & Coverage
    needs: code-quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        microservice: 
          - backend/microservice_1_sync
          - backend/microservice_2_core
          - backend/microservice_3_rag

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install dependencies
      run: |
        cd ${{ matrix.microservice }}
        python -m pip install --upgrade pip
        pip install pytest httpx pytest-cov
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: JaCoCo Equivalent (Pytest + Coverage)
      env:
        DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy_db"
        GROQ_API_KEY: "dummy_key_solo_para_tests"
        SECRET_KEY: "dummy_secret_jwt_para_tests"
      run: |
        cd ${{ matrix.microservice }}
        pytest --cov=. --cov-report=xml:coverage.xml || echo "Tests failed or missing, but continuing to generate report."

    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-reports-${{ strategy.job-index }}
        path: ${{ matrix.microservice }}/coverage.xml