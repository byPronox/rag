# Main CI pipeline: detects changed microservices and runs the reusable pipeline for each one
name: Backend CI Pipeline

on:
  push:
    branches: [ "main", "staging", "feature/**", "fix/**" ]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/service-pipeline.yml"
      - ".github/actions/**"
  pull_request:
    branches: [ "main", "staging" ]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/service-pipeline.yml"
      - ".github/actions/**"
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # Detect which microservices changed
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.set.outputs.services }}
      any: ${{ steps.set.outputs.any }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            shared:
              - '.github/workflows/backend-ci.yml'
              - '.github/workflows/service-pipeline.yml'
              - '.github/actions/**'
            microservice_1_sync:
              - 'backend/microservice_1_sync/**'
            microservice_2_core:
              - 'backend/microservice_2_core/**'
            microservice_3_rag:
              - 'backend/microservice_3_rag/**'

      - name: Build list of services to run
        id: set
        run: |
          ALL='["microservice_1_sync","microservice_2_core","microservice_3_rag"]'
          CHANGES='${{ steps.filter.outputs.changes }}'
          CHANGES=${CHANGES:-[]}

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SERVICES="$ALL"
            echo "Manual run -> running all services"
          elif echo "$CHANGES" | jq -e 'index("shared")' > /dev/null; then
            SERVICES="$ALL"
            echo "Pipeline files changed -> running all services"
          else
            SERVICES=$(echo "$CHANGES" | jq -c 'map(select(. != "shared"))')
          fi

          echo "Services to run: $SERVICES"
          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"
          if [ "$SERVICES" = "[]" ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi

  # Run the reusable pipeline only for changed services
  pipeline:
    name: ${{ matrix.service }}
    needs: changes
    if: needs.changes.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    uses: ./.github/workflows/service-pipeline.yml
    with:
      service: ${{ matrix.service }}
      ml: ${{ matrix.service != 'microservice_2_core' }}
      # Docker build and Trivy scan only on push to staging or main
      run-docker: ${{ github.ref_name == 'main' || github.ref_name == 'staging' }}

  # Post actions: always / success / failure notifications
  notify:
    name: Notify
    needs: [changes, pipeline]
    if: always()
    runs-on: ubuntu-latest
    env:
      RESULT: ${{ needs.pipeline.result }}
      SERVICES: ${{ needs.changes.outputs.services }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: "Post: always - pipeline summary"
        run: |
          {
            echo "## Backend CI Result"
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Event | ${{ github.event_name }} |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Services run | ${SERVICES:-none} |"
            echo "| Result | **${RESULT}** |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Post: success"
        if: needs.pipeline.result == 'success' || (needs.pipeline.result == 'skipped' && needs.changes.result == 'success')
        run: |
          echo "STATUS=✅ Pipeline succeeded" >> "$GITHUB_ENV"
          echo "Pipeline OK on ${{ github.ref_name }}"

      - name: "Post: failure"
        if: needs.pipeline.result == 'failure' || needs.pipeline.result == 'cancelled' || needs.changes.result == 'failure'
        run: |
          echo "STATUS=❌ Pipeline FAILED" >> "$GITHUB_ENV"
          echo "::error::Pipeline failed on ${{ github.ref_name }}"

      - name: Comment on Pull Request
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${process.env.STATUS}\n\n**Services run:** ${process.env.SERVICES || 'none'}\n**Result:** ${process.env.RESULT}\n\n[View run](${process.env.RUN_URL})`
            });

      - name: Notify Discord (optional)
        if: env.DISCORD_WEBHOOK_URL != ''
        continue-on-error: true
        run: |
          MSG="${STATUS} | ${{ github.repository }} | branch ${{ github.ref_name }} | services: ${SERVICES:-none} | ${RUN_URL}"
          jq -n --arg c "$MSG" '{content: $c}' | \
            curl -sS -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK_URL"

      - name: Fail workflow if pipeline failed
        if: needs.pipeline.result == 'failure' || needs.changes.result == 'failure'
        run: exit 1