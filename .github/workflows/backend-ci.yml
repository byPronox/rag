name: Backend CI Pipeline

on:
  push:
    branches: [ "main" ]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------
  # NODO 1: Calidad, Seguridad estática y Pruebas
  # (una sola instalación de dependencias por microservicio)
  # ----------------------------------------------------
  quality-and-tests:
    name: Quality & Tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: microservice_1_sync
            ml: true
          - service: microservice_2_core
            ml: false
          - service: microservice_3_rag
            ml: true
    defaults:
      run:
        working-directory: backend/${{ matrix.service }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          # Caché separado por microservicio (antes los 3 compartían la misma clave)
          cache-dependency-path: backend/${{ matrix.service }}/requirements.txt

      - name: Cache Hugging Face models
        if: matrix.ml
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ matrix.service }}-v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pylint bandit pytest httpx pytest-cov
          if [ "${{ matrix.ml }}" = "true" ]; then
            # torch solo CPU (~200 MB) en lugar de la versión con CUDA (varios GB)
            pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
          else
            pip install -r requirements.txt
          fi

      - name: Capstone - Critical Syntax Check
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Checkstyle Equivalent (Flake8 Full Report)
        run: flake8 . --output-file=flake8-report.txt --exit-zero

      - name: PMD Equivalent (Pylint Static Analysis)
        run: find . -type f -name "*.py" | xargs pylint --output-format=text > pylint-report.txt || true

      - name: Security Static Analysis (Bandit)
        # Se excluyen los tests: 'assert' en pytest genera falsos positivos (B101)
        run: bandit -r . -x ./tests -f txt -o bandit-report.txt || true

      - name: JaCoCo Equivalent (Pytest + Coverage)
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy_db"
          GROQ_API_KEY: "dummy_key_solo_para_tests"
          SECRET_KEY: "dummy_secret_jwt_para_tests"
        run: pytest --cov=. --cov-report=xml:coverage.xml --cov-fail-under=80

      - name: Upload QA, Security & Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.service }}
          if-no-files-found: ignore
          path: |
            backend/${{ matrix.service }}/flake8-report.txt
            backend/${{ matrix.service }}/pylint-report.txt
            backend/${{ matrix.service }}/bandit-report.txt
            backend/${{ matrix.service }}/coverage.xml

  # ----------------------------------------------------
  # NODO 2: Build de la imagen + Escáner de vulnerabilidades (Trivy)
  # Solo en main (push / manual), no en cada Pull Request
  # ----------------------------------------------------
  docker-scan:
    name: Docker Build & Trivy (${{ matrix.service }})
    needs: quality-and-tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      IMAGE: rag-${{ matrix.service }}:ci
    strategy:
      fail-fast: false
      matrix:
        service:
          - microservice_1_sync
          - microservice_2_core
          - microservice_3_rag
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Opcional: si Docker Hub no responde, el pipeline sigue igual
      - name: Log in to Docker Hub (optional)
        if: env.DOCKERHUB_USERNAME != ''
        continue-on-error: true
        timeout-minutes: 2
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Buildx descarga 'moby/buildkit' de Docker Hub; si falla, se usa el build normal
      - name: Set up Docker Buildx
        id: buildx
        continue-on-error: true
        timeout-minutes: 3
        uses: docker/setup-buildx-action@v3

      - name: Build image (with layer cache)
        if: steps.buildx.outcome == 'success'
        uses: docker/build-push-action@v6
        with:
          context: backend/${{ matrix.service }}
          load: true
          push: false
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Build image (fallback without cache)
        if: steps.buildx.outcome != 'success'
        run: |
          echo "::warning::Buildx unavailable (Docker Hub unreachable). Building without layer cache."
          n=0
          until docker build -t "$IMAGE" ./backend/${{ matrix.service }}; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then
              echo "Docker build failed after $n attempts."
              exit 1
            fi
            echo "Build failed (attempt $n). Retrying in $((n*20))s..."
            sleep $((n*20))
          done

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
          scanners: vuln
          ignore-unfixed: true