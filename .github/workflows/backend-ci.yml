name: Backend CI Pipeline

on:
  push:
    branches: [ "main" ]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Code Quality & Security (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service:
          - microservice_1_sync
          - microservice_2_core
          - microservice_3_rag
    defaults:
      run:
        working-directory: backend/${{ matrix.service }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pylint bandit

      - name: Flake8 critical syntax check
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Flake8 full report
        run: flake8 . --output-file=flake8-report.txt --exit-zero

      - name: Pylint static analysis
        run: find . -type f -name "*.py" | xargs pylint --disable=import-error --output-format=text > pylint-report.txt || true

      - name: Bandit security analysis
        run: bandit -r . -x ./tests -f txt -o bandit-report.txt || true

      - name: Upload QA and security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports-${{ matrix.service }}
          if-no-files-found: ignore
          path: |
            backend/${{ matrix.service }}/flake8-report.txt
            backend/${{ matrix.service }}/pylint-report.txt
            backend/${{ matrix.service }}/bandit-report.txt

  testing:
    name: Unit Tests & Coverage (${{ matrix.service }})
    needs: code-quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: microservice_1_sync
            ml: true
          - service: microservice_2_core
            ml: false
          - service: microservice_3_rag
            ml: true
    defaults:
      run:
        working-directory: backend/${{ matrix.service }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/${{ matrix.service }}/requirements.txt

      - name: Cache Hugging Face models
        if: matrix.ml
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ matrix.service }}-v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx pytest-cov
          if [ "${{ matrix.ml }}" = "true" ]; then
            pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
          else
            pip install -r requirements.txt
          fi

      - name: Run tests with coverage
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy_db"
          GROQ_API_KEY: "dummy_key_for_tests"
          SECRET_KEY: "dummy_jwt_secret_for_tests"
        run: pytest --cov=. --cov-report=xml:coverage.xml --cov-fail-under=80

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          if-no-files-found: ignore
          path: backend/${{ matrix.service }}/coverage.xml

  docker-scan:
    name: Docker Build & Trivy Scan (${{ matrix.service }})
    needs: testing
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service:
          - microservice_1_sync
          - microservice_2_core
          - microservice_3_rag
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image with layer cache
        uses: docker/build-push-action@v6
        with:
          context: backend/${{ matrix.service }}
          load: true
          push: false
          tags: rag-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: rag-${{ matrix.service }}:ci
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
          scanners: vuln
          ignore-unfixed: true