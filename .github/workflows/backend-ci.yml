# Main CI pipeline: detects changed services and runs their pipelines
name: Backend CI Pipeline

on:
  push:
    branches: [ "main", "staging", "feature/**", "fix/**" ]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/service-pipeline.yml"
      - ".github/actions/**"
  pull_request:
    branches: [ "main", "staging" ]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/service-pipeline.yml"
      - ".github/actions/**"
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # Detect which services changed
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.set.outputs.services }}
      any: ${{ steps.set.outputs.any }}
      gateway: ${{ steps.set.outputs.gateway }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            shared:
              - '.github/workflows/backend-ci.yml'
              - '.github/workflows/service-pipeline.yml'
              - '.github/actions/**'
            microservice_1_sync:
              - 'backend/microservice_1_sync/**'
            microservice_2_core:
              - 'backend/microservice_2_core/**'
            microservice_3_rag:
              - 'backend/microservice_3_rag/**'
            gateway:
              - 'backend/gateway/**'

      - name: Build list of services to run
        id: set
        run: |
          ALL='["microservice_1_sync","microservice_2_core","microservice_3_rag"]'
          CHANGES='${{ steps.filter.outputs.changes }}'
          CHANGES=${CHANGES:-[]}

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || echo "$CHANGES" | jq -e 'index("shared")' > /dev/null; then
            echo "Manual run or pipeline files changed -> running everything"
            SERVICES="$ALL"
            GATEWAY=true
          else
            SERVICES=$(echo "$CHANGES" | jq -c 'map(select(. != "shared" and . != "gateway"))')
            if echo "$CHANGES" | jq -e 'index("gateway")' > /dev/null; then GATEWAY=true; else GATEWAY=false; fi
          fi

          echo "Services to run: $SERVICES | Gateway: $GATEWAY"
          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"
          echo "gateway=$GATEWAY" >> "$GITHUB_OUTPUT"
          if [ "$SERVICES" = "[]" ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi

  # Run the reusable pipeline only for changed microservices
  pipeline:
    name: ${{ matrix.service }}
    needs: changes
    if: needs.changes.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    uses: ./.github/workflows/service-pipeline.yml
    with:
      service: ${{ matrix.service }}
      ml: ${{ matrix.service != 'microservice_2_core' }}
      # Docker build and Trivy scan only on push to staging or main
      run-docker: ${{ github.ref_name == 'main' || github.ref_name == 'staging' }}

  # Gateway (nginx): lint, build, config test and scan
  gateway:
    name: gateway / Build & Config Test
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/gateway/Dockerfile
          no-fail: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image with layer cache
        uses: docker/build-push-action@v6
        with:
          context: backend/gateway
          load: true
          push: false
          tags: rag-gateway:ci
          # Pull the base image from Google's mirror to avoid registry rate limits
          build-args: |
            BASE_IMAGE=mirror.gcr.io/library/nginx:alpine
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway

      - name: Validate nginx config
        run: |
          docker run --rm \
            -e CORE_HOST=core.internal -e CORE_PORT=8000 \
            -e RAG_HOST=rag.internal -e RAG_PORT=8000 \
            rag-gateway:ci /bin/sh -c \
            "envsubst '\${CORE_HOST} \${CORE_PORT} \${RAG_HOST} \${RAG_PORT}' < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf && nginx -t"

      - name: Run Trivy vulnerability scanner
        if: github.ref_name == 'main' || github.ref_name == 'staging'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: rag-gateway:ci
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
          scanners: vuln
          ignore-unfixed: true

  # Post actions: always / success / failure notifications
  notify:
    name: Notify
    needs: [changes, pipeline, gateway]
    if: always()
    runs-on: ubuntu-latest
    env:
      FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
      SERVICES: ${{ needs.changes.outputs.services }}
      GATEWAY: ${{ needs.changes.outputs.gateway }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: "Post: always - pipeline summary"
        run: |
          if [ "$FAILED" = "true" ]; then RESULT=failure; else RESULT=success; fi
          echo "RESULT=$RESULT" >> "$GITHUB_ENV"
          {
            echo "## Backend CI Result"
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Event | ${{ github.event_name }} |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Services run | ${SERVICES:-none} |"
            echo "| Gateway run | ${GATEWAY:-false} |"
            echo "| Microservices pipeline | ${{ needs.pipeline.result }} |"
            echo "| Gateway build | ${{ needs.gateway.result }} |"
            echo "| Result | **${RESULT}** |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Post: success"
        if: env.FAILED != 'true'
        run: |
          echo "STATUS=✅ Pipeline succeeded" >> "$GITHUB_ENV"
          echo "Pipeline OK on ${{ github.ref_name }}"

      - name: "Post: failure"
        if: env.FAILED == 'true'
        run: |
          echo "STATUS=❌ Pipeline FAILED" >> "$GITHUB_ENV"
          echo "::error::Pipeline failed on ${{ github.ref_name }}"

      - name: Comment on Pull Request
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${process.env.STATUS}\n\n**Services run:** ${process.env.SERVICES || 'none'}\n**Gateway run:** ${process.env.GATEWAY || 'false'}\n**Result:** ${process.env.RESULT}\n\n[View run](${process.env.RUN_URL})`
            });

      - name: Fail workflow if pipeline failed
        if: env.FAILED == 'true'
        run: exit 1