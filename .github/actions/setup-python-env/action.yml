# Reusable composite action
name: "Setup Python env"
description: "Set up Python 3.12 with pip cache and install the microservice dependencies"

inputs:
  service:
    description: "Microservice folder inside backend/"
    required: true
  ml:
    description: "true if the service uses ML models (CPU torch + Hugging Face cache)"
    required: false
    default: "false"
  extra-packages:
    description: "Extra packages to install (linters, pytest, etc.)"
    required: false
    default: ""
  install-requirements:
    description: "true to install requirements.txt"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Set up Python 3.12 (pip cache)
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"
        cache-dependency-path: backend/${{ inputs.service }}/requirements.txt

    - name: Cache Hugging Face models
      if: inputs.ml == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface
        key: hf-${{ inputs.service }}-v1

    - name: Install dependencies
      shell: bash
      working-directory: backend/${{ inputs.service }}
      run: |
        python -m pip install --upgrade pip
        if [ -n "${{ inputs.extra-packages }}" ]; then
          pip install ${{ inputs.extra-packages }}
        fi
        if [ "${{ inputs.install-requirements }}" = "true" ]; then
          if [ "${{ inputs.ml }}" = "true" ]; then
            pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
          else
            pip install -r requirements.txt
          fi
        fi