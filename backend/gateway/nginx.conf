events { worker_connections 1024; }

http {
    server {
        listen 80;

        # ----------------------------------------------------
        # MICROSERVICIO 2 (CORE)
        # ----------------------------------------------------
        location /core/ {
            # 1. Atrapa la petición de seguridad (Preflight / OPTIONS)
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' 'https://rag-frontend-tan.vercel.app' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,x-api-key,Authorization' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            # 2. Añade CORS a las peticiones normales (GET, POST, etc.)
            add_header 'Access-Control-Allow-Origin' 'https://rag-frontend-tan.vercel.app' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,x-api-key,Authorization' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;

            # 3. Enruta a la URL pública que sabemos que funciona
            proxy_pass https://microservice-2-production-f917.up.railway.app/;
        }

        # ----------------------------------------------------
        # MICROSERVICIO 3 (RAG)
        # ----------------------------------------------------
        location /rag/ {
            # 1. Atrapa la petición de seguridad (Preflight / OPTIONS)
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' 'https://rag-frontend-tan.vercel.app' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,x-api-key,Authorization' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            # 2. Añade CORS a las peticiones normales (GET, POST, etc.)
            add_header 'Access-Control-Allow-Origin' 'https://rag-frontend-tan.vercel.app' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,x-api-key,Authorization' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;

            # 3. Enruta a la URL pública que sabemos que funciona
            proxy_pass https://microservice-3-production.up.railway.app/;
        }
    }
}