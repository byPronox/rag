events { worker_connections 1024; }

http {
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;

        location /core/ {
            set $backend_core http://microservice-2:8000;
            proxy_pass $backend_core;
        }

        location /rag/ {
            set $backend_rag http://microservice-3:8001;
            proxy_pass $backend_rag;
        }
    }
}