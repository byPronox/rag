events { worker_connections 1024; }

http {
    resolver [fd12::10] valid=10s ipv4=off;

    set_real_ip_from 100.64.0.0/10;
    set_real_ip_from fd00::/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                    'xff="$http_x_forwarded_for" ua="$http_user_agent"';
    access_log /dev/stdout main;

    map $http_x_api_key $rag_limit_key {
        ""      $binary_remote_addr;
        default $http_x_api_key;
    }

    limit_req_zone $binary_remote_addr zone=login_ip:10m   rate=5r/m;
    limit_req_zone $binary_remote_addr zone=core_ip:10m    rate=20r/s;
    limit_req_zone $binary_remote_addr zone=chat_ip:10m    rate=20r/m;
    limit_req_zone $rag_limit_key      zone=chat_key:10m   rate=60r/m;
    limit_req_zone $rag_limit_key      zone=search_key:10m rate=50r/s;

    limit_req_status 429;
    limit_req_log_level warn;

    server {
        listen 80;

        location @too_many_requests {
            default_type application/json;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Retry-After 60 always;
            return 429 '{"detail":"Too many requests. Please try again in a moment."}';
        }

        # ---------------- Core API ----------------

        location ~ ^/core/(api/v1/auth/login)$ {
            limit_req zone=login_ip burst=5 nodelay;

            set $backend_core "http://${CORE_HOST}:${CORE_PORT}/$1$is_args$args";
            proxy_pass $backend_core;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ ^/core/(.*)$ {
            limit_req zone=core_ip burst=40 nodelay;

            set $backend_core "http://${CORE_HOST}:${CORE_PORT}/$1$is_args$args";
            proxy_pass $backend_core;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---------------- Inference & Search ----------------

        location ~ ^/rag/(api/v1/chat/?)$ {
            error_page 429 = @too_many_requests;
            limit_req zone=chat_ip  burst=10 nodelay;
            limit_req zone=chat_key burst=20 nodelay;

            set $backend_rag "http://${RAG_HOST}:${RAG_PORT}/$1$is_args$args";
            proxy_pass $backend_rag;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        location ~ ^/rag/(.*)$ {
            error_page 429 = @too_many_requests;
            limit_req zone=search_key burst=100 nodelay;

            set $backend_rag "http://${RAG_HOST}:${RAG_PORT}/$1$is_args$args";
            proxy_pass $backend_rag;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}